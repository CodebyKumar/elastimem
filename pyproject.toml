[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elastimem"
version = "0.3.0"
description = "Long-term memory for local AI agents, in one SQLite file"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Kumarswami K" }]
keywords = ["ai", "agents", "memory", "local-first", "llm", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
# Zero required dependencies. The stdlib is the whole story.
dependencies = []

[project.optional-dependencies]
system = ["psutil>=5.9"]      # battery detection; memory readings on Windows
# Built-in embedder (ONNX Runtime, no torch); "auto" uses it when installed.
embed = ["fastembed>=0.4"]

[project.urls]
Homepage = "https://github.com/CodebyKumar/elastimem"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/elastimem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: downloads/loads a real model (the built-in embedder) — excluded by default, run explicitly with -m slow",
]
addopts = "-m 'not slow'"
